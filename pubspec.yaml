name: apophenia_flutter
description: Kuwait Today (كويت اليوم) mobile consumer — gazette content reader.
publish_to: 'none'
version: 1.8.0+8

environment:
  sdk: ^3.8.1

dependencies:
  flutter_skill: ^0.9.36
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.8.1
  flutter_riverpod: ^2.6.1
  supabase_flutter: ^2.9.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  flutter_dotenv: ^5.2.1
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  http: ^1.4.0
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  flutter_spinkit: ^5.2.2
  webview_flutter: ^4.13.1
  myfatoorah_flutter: ^3.3.1
  lottie: ^3.1.2
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/png/logo.jpeg
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/png/logo.jpeg
  remove_alpha_ios: true
  web:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - .env
    - .env.example
    - assets/png/logo.jpeg
    - assets/png/new_logo.jpeg
    - assets/lottie/
